name: Tests

# Tests gate pull requests only. The Codecov baseline for `main` is refreshed
# by coverage-baseline.yml on a schedule, not by a push trigger.
on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        dependency-version: [ prefer-lowest, prefer-stable ]

    name: PHP ${{ matrix.php }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo, gd
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: deps-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-${{ matrix.dependency-version }}
          restore-keys: deps-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's
        # dist cache is keyed on a name whose contents change underneath it. A
        # restored archive is then silently stale: `composer install` reports
        # success and unpacks whatever was cached the first time. That is how
        # `vendor/bin/laranail-pint` went missing here while the tag carried it.
        # Everything else is immutable per version and stays cached.
        # POSIX command: Windows runners default to PowerShell, where this
        # is a Remove-Item parse error rather than a no-op. Git Bash ships on
        # the Windows images, so one line makes the step portable.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        run: |
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml --min=88

      - name: Run security regression suite
        run: vendor/bin/pest --group=security

      # PHP 8.4 / prefer-stable is the canonical coverage row: it writes the
      # job summary, keeps coverage.xml, and uploads to Codecov. The floor is
      # enforced on every row by --min above (composer.json test:coverage
      # carries the same number, which is where the summary reads it from).
      - name: Coverage summary
        # always(): show the numbers even when the run fails the floor.
        if: >-
          always() && matrix.php == '8.4' && matrix.dependency-version == 'prefer-stable'
          && hashFiles('coverage.xml') != ''
        run: php scripts/coverage-summary.php

      - name: Keep coverage.xml
        if: >-
          always() && matrix.php == '8.4' && matrix.dependency-version == 'prefer-stable'
          && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.sha }}
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        id: codecov
        if: matrix.php == '8.4' && matrix.dependency-version == 'prefer-stable'
        # Advisory: the gate is --min, and the job summary shows the numbers.
        # fail_ci_if_error makes the CLI exit non-zero when Codecov answers
        # HTTP >= 400 (with it off, the action always exits 0 and a rejection
        # is silent); continue-on-error keeps that from failing the job, and
        # the next step turns it into a visible warning.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Report a rejected Codecov upload
        if: steps.codecov.outcome == 'failure'
        run: |
          msg="Codecov rejected the upload (repository not activated or token mismatch) — coverage is still enforced by pest --min and shown in the job summary. See the 'Upload coverage to Codecov' step log for the server response."
          echo "::warning title=Codecov upload failed::$msg"
          printf '\n> [!WARNING]\n> %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github

      # laranail-pint, not bare pint: it resolves the ONE shared config in
      # vendor/laranail/package-tools and errors if it is absent. Bare `pint`
      # silently falls back to its own defaults, so this job was reporting
      # "clean" against a rule set no other package in the family uses.
      - name: Run Pint (Code Style)
        run: vendor/bin/laranail-pint --test

      - name: Run PHP CodeSniffer
        run: vendor/bin/phpcs

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Mutation Testing
    # Non-blocking: surfaces weak tests over the pure-logic scope without gating
    # the merge. The MSI threshold is enforced inside infection.json5.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo, gd
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Infection (mutation testing)
        run: vendor/bin/infection --threads=max --no-progress --logger-github

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Security Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run security audit
        run: composer audit

      - name: Scan for committed secrets (gitleaks)
        # Use the gitleaks binary directly — the gitleaks-action requires a paid
        # GITLEAKS_LICENSE for organization repos, while the CLI is free.
        run: |
          ver=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Check for outdated dependencies
        run: composer outdated --direct --strict
        continue-on-error: true
